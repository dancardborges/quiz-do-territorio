<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apresentador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23F4B63A'/%3E%3Cpath d='M12 19s-6-3.7-7.6-7.4C3.3 9 4.8 6 7.7 6c1.7 0 2.8.9 3.5 1.9.7-1 1.8-1.9 3.5-1.9 2.9 0 4.4 3 3.3 5.6C16.4 15.3 12 19 12 19z' fill='%230B2B57'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body class="stage">

<header class="topbar">
  <div class="logo"><span class="mark">★</span><span data-app-name></span></div>
  <div class="row">
    <span class="pill" id="topPin" hidden></span>
    <button class="btn ghost small" id="soundBtn" title="Liga/desliga o som">🔊 Som</button>
    <button class="btn ghost small" id="fsBtn" title="Tela cheia (F)">⛶ Tela cheia</button>
    <button class="btn ghost small" id="logoutBtn" hidden>Sair</button>
  </div>
</header>

<!-- Login -->
<section class="screen center-col" id="s-login">
  <h1 style="font-size:2.6rem" data-app-name></h1>
  <p style="margin:0;opacity:.85">Área do apresentador</p>
  <form class="card login-card" id="loginForm">
    <div class="field"><label for="email">E-mail</label><input class="input" id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">Senha</label><input class="input" id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn blue big" style="width:100%" type="submit" id="loginBtn">Entrar</button>
  </form>
  <a href="index.html" style="color:#cfe0f5">Sou participante → entrar com PIN</a>
</section>

<!-- Painel -->
<section class="screen dash" id="s-dash">
  <div class="row">
    <h1 style="font-size:2.2rem">Meus quizzes</h1>
    <span class="spacer"></span>
    <a class="btn" href="editor.html">+ Novo quiz</a>
  </div>
  <div class="card" style="padding:16px 20px">
    <div class="toggles">
      <b>Opções do jogo:</b>
      <label class="toggle"><input type="checkbox" id="optShuffle" checked> Embaralhar as respostas</label>
      <label class="toggle"><input type="checkbox" id="optMusic" checked> Música no saguão</label>
      <label class="toggle"><input type="checkbox" id="optShowPhone" checked> Mostrar pergunta no celular</label>
    </div>
  </div>
  <div class="qlist" id="qlist"><div class="muted" style="color:#cfe0f5">Carregando…</div></div>
</section>

<!-- Saguão -->
<section class="screen stage-main" id="s-lobby">
  <div class="lobby-top">
    <div class="joinbox">
      <div class="how">Entre em <b id="joinUrl"></b> e digite o PIN:</div>
      <div class="bigpin" id="bigPin"></div>
    </div>
    <div class="qr" id="qr"></div>
  </div>
  <div class="lobby-bar">
    <div class="counter" style="text-align:left"><b id="nPlayers">0</b>participantes</div>
    <div class="head" style="font-size:1.6rem;text-align:center" id="lobbyTitle"></div>
    <button class="btn big" id="startBtn" disabled>Começar ▶</button>
  </div>
  <div class="chips" id="chips"></div>
  <div style="opacity:.7;font-size:.9rem">Clique num nome para remover o participante.</div>
</section>

<!-- Pergunta sendo lida -->
<section class="screen stage-main" id="s-intro">
  <div class="pill" id="introNum"></div>
  <div class="qtext" id="introText"></div>
  <div class="introbar"><i id="introBar"></i></div>
</section>

<!-- Pergunta valendo -->
<section class="screen stage-main" id="s-question">
  <div class="qhead"><span class="pill" id="qNum"></span><button class="btn ghost small" id="skipBtn">Encerrar tempo ⏭</button></div>
  <div class="qtext" id="qText"></div>
  <div class="qmid">
    <div class="timer" id="timer">20</div>
    <div id="qMedia"></div>
    <div class="counter"><b id="nAns">0</b>respostas</div>
  </div>
  <div class="answers" id="qAnswers"></div>
</section>

<!-- Resultado da pergunta -->
<section class="screen stage-main" id="s-reveal">
  <div class="qhead"><span class="pill" id="rNum"></span><button class="btn" id="toBoardBtn">Placar ▶</button></div>
  <div class="qtext" id="rText"></div>
  <div class="bars" id="bars"></div>
  <div class="answers" id="rAnswers"></div>
</section>

<!-- Placar -->
<section class="screen stage-main" id="s-board">
  <div class="qhead"><h1 style="font-size:2.6rem">Placar</h1><button class="btn big" id="nextBtn">Próxima ▶</button></div>
  <div class="board" id="board"></div>
</section>

<!-- Pódio -->
<section class="screen stage-main" id="s-podium">
  <h1 style="font-size:3rem" id="podTitle">Pódio</h1>
  <div class="podium" id="podium"></div>
  <div class="row" style="justify-content:center">
    <button class="btn light" id="csvBtn">⬇ Baixar resultados (Excel)</button>
    <button class="btn ghost" id="backBtn">Voltar ao painel</button>
  </div>
</section>

<section class="screen center-col" id="s-loading"><div class="spinner"></div></section>
<div id="reactLayer" aria-hidden="true"></div>

<div class="footer-tag" data-tagline></div>
<script type="module" src="js/host.js?v=7"></script>
</body>
</html>
